# Publishes the site to GitHub Pages (docs/DEPLOYMENT.md). The repository's Pages source must be
# set to "GitHub Actions". Optional network settings come from repository variables (not secrets:
# they end up in the built page either way).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          TETRIZZ_SUPABASE_URL: ${{ vars.TETRIZZ_SUPABASE_URL }}
          TETRIZZ_SUPABASE_KEY: ${{ vars.TETRIZZ_SUPABASE_KEY }}
          TETRIZZ_SERVER_URL: ${{ vars.TETRIZZ_SERVER_URL }}
          TETRIZZ_MQTT_BROKERS: ${{ vars.TETRIZZ_MQTT_BROKERS }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
