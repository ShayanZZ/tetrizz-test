# promtool test rules deploy/prometheus/tests/tetrizz.test.yml
rule_files:
  - ../rules/tetrizz.yml

evaluation_interval: 30s

tests:
  - interval: 30s
    input_series:
      - series: 'up{job="tetrizz"}'
        values: "1x4 0x10"
    alert_rule_test:
      - eval_time: 2m
        alertname: TetrizzServerDown
        exp_alerts: []
      - eval_time: 6m
        alertname: TetrizzServerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: tetrizz
            exp_annotations:
              summary: The room server does not answer /metrics
              description: Prometheus could not scrape the server for 2 minutes. Players cannot create or join server rooms.

  - interval: 1m
    input_series:
      - series: "tetrizz_db_size_bytes"
        values: "70000000+0x20 90000000+0x20"
      - series: "tetrizz_db_budget_bytes"
        values: "100000000+0x40"
    alert_rule_test:
      - eval_time: 15m
        alertname: TetrizzDatabaseNearBudget
        exp_alerts: []
      - eval_time: 35m
        alertname: TetrizzDatabaseNearBudget
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: The database is above 80 % of DB_MAX_MB
              description: At 100 % the server halves its retention periods until the database fits.
      - eval_time: 35m
        alertname: TetrizzDatabaseOverBudget
        exp_alerts: []

  - interval: 5m
    input_series:
      - series: 'tetrizz_janitor_last_ok_timestamp_seconds{exported_job="settle"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 1h
        alertname: TetrizzMaintenanceStalled
        exp_alerts: []
      - eval_time: 4h
        alertname: TetrizzMaintenanceStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: settle
            exp_annotations:
              summary: The maintenance job has not succeeded for over 3 hours
              description: Rollups, purging and the size budget are not being kept up. Look at the server's log.

  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/",fstype="ext4",instance="node-exporter:9100",job="node"}'
        values: "30000000000x10 10000000000x30"
      - series: 'node_filesystem_size_bytes{mountpoint="/",fstype="ext4",instance="node-exporter:9100",job="node"}'
        values: "100000000000x40"
    alert_rule_test:
      - eval_time: 9m
        alertname: HostDiskLow
        exp_alerts: []
      - eval_time: 30m
        alertname: HostDiskLow
        exp_alerts:
          - exp_labels:
              severity: warning
              mountpoint: /
              fstype: ext4
              instance: node-exporter:9100
              job: node
            exp_annotations:
              summary: Less than 15 % of the disk is free
              description: Free space on / is 10%. Old logs, backups and Docker images are the usual suspects.

  - interval: 30s
    input_series:
      - series: 'up{job="loki"}'
        values: "1x4 0x20"
      - series: 'up{job="alertmanager"}'
        values: "1x24"
    alert_rule_test:
      - eval_time: 3m
        alertname: MonitoringComponentDown
        exp_alerts: []
      - eval_time: 10m
        alertname: MonitoringComponentDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: loki
            exp_annotations:
              summary: loki does not answer
              description: Prometheus could not scrape loki for 5 minutes. Logs or alert delivery may be missing.

  - interval: 30s
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
            exp_annotations:
              summary: Always firing; proves that alerting works end to end
              description: Alertmanager sends this to the heartbeat address (ALERT_HEARTBEAT_URL). It never goes to Telegram or Discord.

  - interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{integration="telegram"}'
        values: "0 0 0 0 0 5 10 15 20 25 30 35 40 45 50 55 60 65 70 75 80"
      - series: 'alertmanager_notifications_failed_total{integration="discord"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 3m
        alertname: AlertDeliveryFailing
        exp_alerts: []
      - eval_time: 15m
        alertname: AlertDeliveryFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              integration: telegram
            exp_annotations:
              summary: Alertmanager cannot deliver to telegram
              description: More than 2 failed deliveries in 30 minutes. Check the bot token, chat id or webhook address in .env (docker compose logs alertmanager).
