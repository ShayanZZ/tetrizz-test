# Prometheus for the TetriZZ stack (compose.monitoring.yaml). Everything is reached by container name
# on the private network. Reloaded by restarting the container: docker compose restart prometheus
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

# Firing alerts go to Alertmanager, which decides who hears about them (deploy/alertmanager).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The room server. It labels its maintenance series with "job" (live, settle); Prometheus keeps
  # its own job label and renames the server's to exported_job, which the rules and dashboards use.
  - job_name: tetrizz
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["server:8787"]

  - job_name: node
    scrape_interval: 60s
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    scrape_interval: 60s
    static_configs:
      - targets: ["localhost:9090"]

  # The logging pipeline and the alert delivery: up == 0 for one of these is the alert MonitoringComponentDown.
  - job_name: loki
    scrape_interval: 60s
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    scrape_interval: 60s
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: alertmanager
    scrape_interval: 60s
    static_configs:
      - targets: ["alertmanager:9093"]
